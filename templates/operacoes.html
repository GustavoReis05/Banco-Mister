<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Banco Mister - Operações</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='operacoes.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('inicio') }}">Início</a> |
        <a href="{{ url_for('pagina_cadastro') }}">Cadastros</a> |
        <a href="{{ url_for('pagina_lista') }}">Listagem</a> |
        <a href="{{ url_for('pagina_busca') }}">Busca</a> |
        <a href="{{ url_for('pagina_operacoes') }}">Operações</a> |
        <a href="{{ url_for('pagina_extremos_saldos') }}">Extremos de Saldo</a>
    </nav>
    <hr>

    <h1>Operações Bancárias</h1>

    {% with mensagens = get_flashed_messages() %}
        {% if mensagens %}
            <ul>
                {% for msg in mensagens %}
                    <li><strong>{{ msg }}</strong></li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('pagina_operacoes') }}" method="POST">
        <label>Operação:</label><br>
        <select name="operacao" required>
            <option value="depositar">Depositar</option>
            <option value="sacar">Sacar</option>
            <option value="transferir">Transferir</option>
        </select><br><br>

        <label>Número da Conta (Origem):</label><br>
        <input type="text" name="numero_conta" required><br><br>

        <label>Número da Conta de Destino (apenas para Transferência):</label><br>
        <input type="text" name="numero_destino" placeholder="Opcional para saque/depósito"><br><br>

        <label>Valor (R$):</label><br>
        <input type="text" name="valor" placeholder="Ex: 150.00" required><br><br>

        <button type="submit">Executar Operação</button>
    </form>
</body>
</html>
