<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Banco Mister - Cadastros</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastro.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('inicio') }}">Início</a> |
        <a href="{{ url_for('pagina_cadastro') }}">Cadastros</a> |
        <a href="{{ url_for('pagina_lista') }}">Listagem</a> |
        <a href="{{ url_for('pagina_busca') }}">Busca</a> |
        <a href="{{ url_for('pagina_operacoes') }}">Operações</a> |
        <a href="{{ url_for('pagina_extremos_saldos') }}">Extremos de Saldo</a>
    </nav>
    <hr>

    <h1>Cadastros</h1>

    {% with mensagens = get_flashed_messages() %}
        {% if mensagens %}
            <ul>
                {% for msg in mensagens %}
                    <li><strong>{{ msg }}</strong></li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <h2>Novo Cliente</h2>
    <form action="{{ url_for('receber_cadastro_cliente') }}" method="POST">
        <label>CPF:</label><br>
        <input type="text" name="cpf" placeholder="000.000.000-00" required><br><br>

        <label>Nome Completo:</label><br>
        <input type="text" name="nome" required><br><br>

        <label>Data de Nascimento:</label><br>
        <input type="date" name="data_nascimento" required><br><br>

        <label>Telefone:</label><br>
        <input type="text" name="numero_telefone" required><br><br>

        <button type="submit">Cadastrar Cliente</button>
    </form>

    <hr>

    <h2>Nova Conta</h2>
    <form action="{{ url_for('cadastrar_conta') }}" method="POST">
        <label>Cliente (CPF ou Nome):</label><br>
        <input type="text" name="termo_busca" placeholder="Digite o CPF ou nome do titular" required><br><br>

        <label>Número da Conta:</label><br>
        <input type="text" name="numero_conta" required><br><br>

        <label>Tipo de Conta:</label><br>
        <select name="tipo" required>
            <option value="corrente">Conta Corrente</option>
            <option value="poupança">Conta Poupança</option>
        </select><br><br>

        <button type="submit">Abrir Conta</button>
    </form>
</body>
</html>
